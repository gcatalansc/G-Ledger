name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  PROJECT_LEDGER_CANDIDATE_SHA: bd564cdba07b616337681c15801d22478824108b

jobs:
  test:
    name: test-${{ matrix.os }}
    env:
      RUSTUP_TOOLCHAIN: 1.97.1
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.PROJECT_LEDGER_CANDIDATE_SHA }}
          persist-credentials: false
      - name: Verify exact candidate checkout
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:PROJECT_LEDGER_CANDIDATE_SHA) { throw "Candidate checkout mismatch: $actual" }
          if (git status --porcelain) { throw 'Candidate checkout is not clean' }
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2.9.2
      - run: cargo fetch --locked
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-targets --all-features
      - run: cargo xtask schema check
      - run: cargo run -p project-ledger-cli -- specs verify
      - run: cargo run -p project-ledger-cli -- contracts verify
      - run: cargo build --locked --release -p project-ledger-cli
      - run: cargo xtask release check
      - run: cargo run -p project-ledger-cli -- release verify
      - name: Build and exercise the extracted Windows ZIP
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build-windows-package.ps1 -Output "dist/project-ledger-0.2.0-windows-x86_64.zip" -RequireClean
      - name: Preserve verified Windows delivery
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: project-ledger-windows-${{ env.PROJECT_LEDGER_CANDIDATE_SHA }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  dependency-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.PROJECT_LEDGER_CANDIDATE_SHA }}
          persist-credentials: false
      - name: Verify exact candidate checkout
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:PROJECT_LEDGER_CANDIDATE_SHA) { throw "Candidate checkout mismatch: $actual" }
          if (git status --porcelain) { throw 'Candidate checkout is not clean' }
      - uses: EmbarkStudios/cargo-deny-action@v2.1.1
        with:
          command: check

  physical-disk-full-chaos:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: 1.97.1
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.PROJECT_LEDGER_CANDIDATE_SHA }}
          persist-credentials: false
      - name: Verify exact candidate checkout
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:PROJECT_LEDGER_CANDIDATE_SHA) { throw "Candidate checkout mismatch: $actual" }
          if (git status --porcelain) { throw 'Candidate checkout is not clean' }
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2.9.2
      - run: cargo fetch --locked
      - name: Mount bounded ephemeral filesystem
        shell: bash
        run: |
          set -euo pipefail
          volume_root="$(mktemp -d "${RUNNER_TEMP}/project-ledger-disk-full.XXXXXX")"
          echo "PROJECT_LEDGER_CHAOS_VOLUME_ROOT=$volume_root" >> "$GITHUB_ENV"
          mount_dir="$volume_root/mount"
          volume_image="$volume_root/volume.ext4"
          mkdir "$mount_dir"
          truncate -s 32M "$volume_image"
          mkfs.ext4 -q -F -m 0 "$volume_image"
          sudo mount -o loop,nosuid,nodev,noexec "$volume_image" "$mount_dir"
          sudo chown "$(id -u):$(id -g)" "$mount_dir"
          echo 'project-ledger-disk-full/0.2.0' > "$mount_dir/project-ledger-ephemeral-disk-full.marker"
          echo "PROJECT_LEDGER_DISK_FULL_ROOT=$mount_dir" >> "$GITHUB_ENV"
          findmnt --target "$mount_dir" --output SOURCE,FSTYPE,SIZE,AVAIL
      - name: Verify physical ENOSPC rollback and recovery
        run: cargo test -p project-ledger-storage-sqlite --test disk_full physical_kernel_enospc_rolls_back_and_reopens_with_the_committed_chain -- --ignored --exact --nocapture --test-threads=1
      - name: Unmount bounded ephemeral filesystem
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if test -n "${PROJECT_LEDGER_CHAOS_VOLUME_ROOT:-}"; then
            mount_dir="$PROJECT_LEDGER_CHAOS_VOLUME_ROOT/mount"
            volume_image="$PROJECT_LEDGER_CHAOS_VOLUME_ROOT/volume.ext4"
            if mountpoint -q "$mount_dir"; then
              sudo umount "$mount_dir"
            fi
            if test -f "$volume_image"; then
              rm -- "$volume_image"
            fi
            rmdir "$mount_dir" 2>/dev/null || true
            rmdir "$PROJECT_LEDGER_CHAOS_VOLUME_ROOT"
          fi

  live-gsp-sidecar-chaos:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: 1.97.1
      UV_LINK_MODE: copy
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.PROJECT_LEDGER_CANDIDATE_SHA }}
          persist-credentials: false
      - name: Verify exact candidate checkout
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:PROJECT_LEDGER_CANDIDATE_SHA) { throw "Candidate checkout mismatch: $actual" }
          if (git status --porcelain) { throw 'Candidate checkout is not clean' }
      - uses: actions/checkout@v7.0.1
        with:
          repository: gcatalansc/gsp-gemma-compiler
          ref: 7a43559c02417641691dbb5f2a6e79c13d74d1a1
          path: .tooling/rq4-gsp-runtime
          persist-credentials: false
      - uses: actions/checkout@v7.0.1
        with:
          repository: gcatalansc/gsp-spec
          ref: 004b14d7b64837025671970eac2469f092c49475
          path: .tooling/rq4-gsp-spec
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.11.16'
          enable-cache: false
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2.9.2
      - name: Provision and verify the exact optional counterpart
        shell: bash
        run: |
          set -euo pipefail
          source_root="$GITHUB_WORKSPACE/.tooling/rq4-gsp-runtime"
          test "$(git -C "$source_root" rev-parse HEAD)" = 7a43559c02417641691dbb5f2a6e79c13d74d1a1
          uv sync --frozen --project "$source_root"
          test -z "$(git -C "$source_root" status --porcelain)"
          echo "PROJECT_LEDGER_GSP_SOURCE_ROOT=$source_root" >> "$GITHUB_ENV"
          echo "PROJECT_LEDGER_GSP_PYTHON=$source_root/.venv/bin/python" >> "$GITHUB_ENV"
          echo "GSPGEMMA_UPSTREAM_ROOT=$GITHUB_WORKSPACE/.tooling/rq4-gsp-spec" >> "$GITHUB_ENV"
          echo "GSPGEMMA_REPORTS_DIR=$RUNNER_TEMP/gsp-contract-reports" >> "$GITHUB_ENV"
          git -C "$source_root" rev-parse HEAD
          "$source_root/.venv/bin/python" --version
      - name: Verify the unchanged counterpart contracts and runtime
        shell: bash
        run: |
          set -euo pipefail
          python_bin="$PROJECT_LEDGER_GSP_PYTHON"
          "$python_bin" -I -B -m gspgemma verify-upstream-hashes
          "$python_bin" -I -B -m gspgemma validate-contracts
          "$python_bin" -I -B -m gspgemma fixture-replay
          "$python_bin" -I -B -m pytest .tooling/rq4-gsp-runtime/tests/test_public_api.py .tooling/rq4-gsp-runtime/tests/test_compiler.py .tooling/rq4-gsp-runtime/tests/test_contracts.py -q -p no:cacheprovider
          test -z "$(git -C "$PROJECT_LEDGER_GSP_SOURCE_ROOT" status --porcelain)"
      - run: cargo fetch --locked
      - name: Validate artifact adapter style
        run: .tooling/rq4-gsp-runtime/.venv/bin/python -I -B -m ruff check --no-cache integrations/gsp/sidecar/compile_bundle.py crates/cli/tests/gsp_live/crash_probe.py
      - name: Verify actual GSP compilation, rejection and crash recovery
        run: 'cargo test -p project-ledger-cli --test gsp_bridge live_sidecar:: -- --ignored --nocapture --test-threads=1'
      - name: Verify supervised pinned GSP runtime matrix
        run: 'cargo test -p project-ledger-cli --test gsp_bridge supervised::actual_ -- --ignored --nocapture --test-threads=1'
