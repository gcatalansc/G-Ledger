[workspace]
resolver = "2"
members = [
  "crates/canonical-json",
  "crates/domain",
  "crates/event-store",
  "crates/projection-engine",
  "crates/lifecycle",
  "crates/gate-engine",
  "crates/evidence",
  "crates/continuity",
  "crates/integration-protocol",
  "crates/interop-gskills",
  "crates/interop-gsp",
  "crates/interop-radar",
  "crates/legacy-import",
  "crates/portable-bundle",
  "crates/project-catalog",
  "crates/application",
  "crates/artifact-exchange",
  "crates/storage-sqlite",
  "crates/transport-stdio",
  "crates/schemas",
  "crates/cli",
  "xtask",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.97.1"
license = "Apache-2.0"
authors = ["Project Ledger contributors"]

[workspace.dependencies]
assert_cmd = "2.2.2"
clap = { version = "4.6.6", features = ["derive"] }
jsonschema = { version = "0.50.1", default-features = false }
predicates = "3.1.3"
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled", "libsqlite3-sys"] }
schemars = { version = "1.2.2", features = ["uuid1"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"
serde_json_canonicalizer = "0.3.2"
sha2 = "0.11.0"
tempfile = "3.27.0"
thiserror = "2.0.20"
time = { version = "0.3.55", features = ["formatting", "parsing", "serde"] }
uuid = { version = "1.25.0", features = ["serde", "v7"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
